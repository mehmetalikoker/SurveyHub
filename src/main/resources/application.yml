spring:
  application:
    name: surveyhub
  datasource:
    url: jdbc:h2:file:./data/surveyhub;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8080

surveyhub:
  api:
    key: ${SURVEYHUB_API_KEY:dev-key}
  admin:
    username: ${SURVEYHUB_ADMIN_USERNAME:admin}
    password: ${SURVEYHUB_ADMIN_PASSWORD:changeme}
