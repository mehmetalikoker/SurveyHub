<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>SurveyHub</title>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link th:href="@{/css/theme.css}" rel="stylesheet"/>
    <style>
        .dashboard-tile {
            display: block;
            border-radius: 16px;
            padding: 2.5rem 2rem;
            text-decoration: none;
            color: #fff;
            background: linear-gradient(160deg, var(--ing-orange) 0%, var(--ing-orange-dark) 100%);
            transition: transform .15s ease, box-shadow .15s ease;
            height: 100%;
        }

        .dashboard-tile:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 24px rgba(255, 98, 0, .25);
            color: #fff;
        }

        .dashboard-tile.outline {
            background: #fff;
            color: #212529;
            border: 2px solid var(--ing-orange);
        }

        .dashboard-tile .icon {
            display: block;
            margin-bottom: .75rem;
        }

        .dashboard-tile h2 {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: .25rem;
        }

        .dashboard-tile p {
            margin-bottom: 0;
            opacity: .9;
        }

        .dashboard-tile.outline p {
            color: #6c757d;
            opacity: 1;
        }
    </style>
</head>
<body>
<nav class="navbar ing-navbar mb-5">
    <div class="container d-flex justify-content-between align-items-center" style="max-width: 780px;">
        <span class="navbar-brand mb-0">SurveyHub</span>
        <form method="post" th:action="@{/logout}" class="mb-0">
            <button type="submit" class="btn btn-link btn-sm ing-navbar-link">Çıkış</button>
        </form>
    </div>
</nav>
<div class="container pb-5" style="max-width: 780px;">
    <h1 class="h3 mb-1">Hoş geldin</h1>
    <p class="text-muted mb-4">Ne yapmak istersin?</p>

    <div class="row g-4">
        <div class="col-md-6">
            <a th:href="@{/admin/surveys/new}" class="dashboard-tile">
                <svg class="icon" width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="2" stroke-linecap="round">
                    <circle cx="12" cy="12" r="10" stroke-opacity=".55"/>
                    <path d="M12 7v10M7 12h10"/>
                </svg>
                <h2>Anket Ekleme</h2>
                <p>Yeni bir anket oluştur ve soru eklemeye başla.</p>
            </a>
        </div>
        <div class="col-md-6">
            <a th:href="@{/admin/surveys}" class="dashboard-tile outline">
                <svg class="icon" width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#FF6200"
                     stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="4" y="3" width="16" height="18" rx="2"/>
                    <path d="M8 8h8M8 12h8M8 16h5"/>
                </svg>
                <h2>Anket Yönetimi</h2>
                <p>Mevcut anketleri görüntüle, taslaklara devam et.</p>
            </a>
        </div>
    </div>
</div>
</body>
</html>
