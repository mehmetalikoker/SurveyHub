<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Soru Ekle - SurveyHub</title>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link th:href="@{/css/theme.css}" rel="stylesheet"/>
</head>
<body>
<nav class="navbar ing-navbar mb-4">
    <div class="container d-flex justify-content-between align-items-center" style="max-width: 720px;">
        <div>
            <a th:href="@{/admin}" class="navbar-brand mb-0" style="text-decoration: none;">SurveyHub</a>
            <a th:href="@{/admin/surveys}" class="navbar-text" style="text-decoration: none;">Anket Yönetimi</a>
        </div>
        <form method="post" th:action="@{/logout}" class="mb-0">
            <button type="submit" class="btn btn-link btn-sm ing-navbar-link">Çıkış</button>
        </form>
    </div>
</nav>
<div class="container pb-5" style="max-width: 720px;">
    <h1 class="h3 mb-1" th:text="${survey.title}">Soru Ekle</h1>
    <p class="text-muted mb-4" th:if="${survey.description}" th:text="${survey.description}"></p>

    <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

    <!-- Anket yayınlandıysa (artık DRAFT değil): özet göster, giriş formu gizli -->
    <div th:if="${survey.status != T(org.ing.surveyhub.domain.SurveyStatus).DRAFT}">
        <div class="alert alert-success">
            Anket tamamlandı — <strong th:text="${#lists.size(survey.questions)}"></strong> soru kaydedildi.
        </div>

        <h2 class="h5 mb-3">Kaydedilen Sorular</h2>
        <div th:each="q, stat : ${survey.questions}" class="mb-3">
            <div class="text-muted small mb-1" th:text="|${stat.count}. soru|"></div>
            <div th:replace="~{admin/questions/fragments/preview :: render(${q}, ${q.options.![text]})}"></div>
        </div>

        <a th:href="@{/admin/surveys/new}" class="btn btn-outline-primary mt-3">Yeni Anket Başlat</a>
    </div>

    <!-- Anket hâlâ taslaksa: eklenen sorular listesi + yeni soru formu -->
    <div th:if="${survey.status == T(org.ing.surveyhub.domain.SurveyStatus).DRAFT}">

        <div th:if="${!#lists.isEmpty(survey.questions)}" class="mb-4">
            <h2 class="h5 mb-3">Eklenen Sorular (<span th:text="${#lists.size(survey.questions)}"></span>)</h2>
            <div th:each="q, stat : ${survey.questions}" class="mb-3">
                <div class="text-muted small mb-1" th:text="|${stat.count}. soru|"></div>
                <div th:replace="~{admin/questions/fragments/preview :: render(${q}, ${q.options.![text]})}"></div>
            </div>
        </div>

        <div th:if="${previewed}" class="mb-4">
            <h2 class="h6 mb-2">Önizleme</h2>
            <div th:replace="~{admin/questions/fragments/preview :: render(${questionForm}, ${questionForm.options})}"></div>
        </div>

        <form method="post" th:action="@{/admin/surveys/{surveyId}/questions/preview(surveyId=${survey.id})}"
              th:object="${questionForm}">

            <div class="mb-3">
                <label class="form-label" for="text">Soru Metni</label>
                <textarea class="form-control" id="text" th:field="*{text}" rows="2" required></textarea>
            </div>

            <div class="row">
                <div class="col-md-8 mb-3">
                    <label class="form-label" for="section">Bölüm (opsiyonel)</label>
                    <input type="text" class="form-control" id="section" th:field="*{section}"/>
                </div>
                <div class="col-md-4 mb-3 d-flex align-items-end">
                    <div class="form-check">
                        <input type="checkbox" class="form-check-input" id="required" th:field="*{required}"/>
                        <label class="form-check-label" for="required">Zorunlu soru</label>
                    </div>
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label" for="type">Soru Tipi</label>
                <select class="form-select" id="type" th:field="*{type}">
                    <option th:each="qt : ${questionTypes}" th:value="${qt}" th:text="${qt.label}"></option>
                </select>
            </div>

            <!-- Çoktan Seçmeli -->
            <fieldset class="question-type-section border rounded p-3 mb-4" data-type="MULTIPLE_CHOICE">
                <legend class="h6">Çoktan Seçmeli Ayarları</legend>

                <div class="form-check mb-3">
                    <input type="checkbox" class="form-check-input" id="allowMultipleSelection"
                           th:field="*{allowMultipleSelection}"/>
                    <label class="form-check-label" for="allowMultipleSelection">Birden fazla seçime izin ver</label>
                </div>

                <label class="form-label">Seçenekler</label>
                <div id="optionsContainer">
                    <div class="input-group mb-2 option-row" th:each="opt : *{options}">
                        <input type="text" class="form-control" name="options" th:value="${opt}"
                               placeholder="Seçenek metni"/>
                        <button type="button" class="btn btn-outline-danger remove-option">Sil</button>
                    </div>
                </div>
                <button type="button" id="addOptionBtn" class="btn btn-sm btn-outline-secondary">+ Seçenek Ekle</button>
            </fieldset>

            <!-- Açık Uçlu -->
            <fieldset class="question-type-section border rounded p-3 mb-4" data-type="OPEN_ENDED">
                <legend class="h6">Açık Uçlu Ayarları</legend>
                <div class="mb-2">
                    <label class="form-label" for="maxLength">Maksimum karakter (opsiyonel)</label>
                    <input type="number" class="form-control" id="maxLength" th:field="*{maxLength}" min="1"
                           style="max-width: 160px;"/>
                </div>
            </fieldset>

            <!-- Likert -->
            <fieldset class="question-type-section border rounded p-3 mb-4" data-type="LIKERT">
                <legend class="h6">Likert Ayarları</legend>
                <div class="row">
                    <div class="col-md-4 mb-2">
                        <label class="form-label" for="likertScale">Ölçek</label>
                        <select class="form-select" id="likertScale" th:field="*{likertScale}">
                            <option value="3">3'lü</option>
                            <option value="5">5'li</option>
                            <option value="7">7'li</option>
                        </select>
                    </div>
                    <div class="col-md-4 mb-2">
                        <label class="form-label" for="likertMinLabel">En düşük uç etiketi</label>
                        <input type="text" class="form-control" id="likertMinLabel" th:field="*{likertMinLabel}"/>
                    </div>
                    <div class="col-md-4 mb-2">
                        <label class="form-label" for="likertMaxLabel">En yüksek uç etiketi</label>
                        <input type="text" class="form-control" id="likertMaxLabel" th:field="*{likertMaxLabel}"/>
                    </div>
                </div>
            </fieldset>

            <!-- Derecelendirme -->
            <fieldset class="question-type-section border rounded p-3 mb-4" data-type="RATING">
                <legend class="h6">Derecelendirme Ayarları</legend>
                <div class="row">
                    <div class="col-md-4 mb-2">
                        <label class="form-label" for="minValue">Min. değer</label>
                        <input type="number" class="form-control" id="minValue" th:field="*{minValue}"/>
                    </div>
                    <div class="col-md-4 mb-2">
                        <label class="form-label" for="maxValue">Maks. değer</label>
                        <input type="number" class="form-control" id="maxValue" th:field="*{maxValue}"/>
                    </div>
                </div>
            </fieldset>

            <div class="d-flex gap-2">
                <button type="submit"
                        th:formaction="@{/admin/surveys/{surveyId}/questions/preview(surveyId=${survey.id})}"
                        class="btn btn-outline-primary">Soruyu Önizle</button>
                <button type="submit"
                        th:formaction="@{/admin/surveys/{surveyId}/questions/add(surveyId=${survey.id})}"
                        class="btn btn-primary">Soru Ekle</button>
            </div>
        </form>

        <form method="post" th:action="@{/admin/surveys/{surveyId}/questions/finish(surveyId=${survey.id})}"
              class="mt-3" th:if="${!#lists.isEmpty(survey.questions)}">
            <button type="submit" class="btn btn-success">Anketi Bitir</button>
        </form>
    </div>
</div>

<script th:inline="none">
    (function () {
        var typeSelect = document.getElementById('type');
        if (!typeSelect) {
            return; // anket tamamlandı, form/soru ekleme alanı sayfada yok
        }

        var sections = document.querySelectorAll('.question-type-section');

        function syncVisibleSection() {
            var selected = typeSelect.value;
            sections.forEach(function (section) {
                section.style.display = (section.dataset.type === selected) ? '' : 'none';
            });
        }

        typeSelect.addEventListener('change', syncVisibleSection);
        syncVisibleSection();

        var optionsContainer = document.getElementById('optionsContainer');

        function wireRemoveButton(button) {
            button.addEventListener('click', function () {
                button.closest('.option-row').remove();
            });
        }

        optionsContainer.querySelectorAll('.remove-option').forEach(wireRemoveButton);

        document.getElementById('addOptionBtn').addEventListener('click', function () {
            var row = document.createElement('div');
            row.className = 'input-group mb-2 option-row';
            row.innerHTML =
                '<input type="text" class="form-control" name="options" placeholder="Seçenek metni"/>' +
                '<button type="button" class="btn btn-outline-danger remove-option">Sil</button>';
            optionsContainer.appendChild(row);
            wireRemoveButton(row.querySelector('.remove-option'));
        });
    })();
</script>
</body>
</html>
