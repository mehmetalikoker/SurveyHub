<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Yeni Anket - SurveyHub</title>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link th:href="@{/css/theme.css}" rel="stylesheet"/>
</head>
<body>
<nav class="navbar ing-navbar mb-4">
    <div class="container d-flex justify-content-between align-items-center" style="max-width: 720px;">
        <div>
            <a th:href="@{/admin}" class="navbar-brand mb-0" style="text-decoration: none;">SurveyHub</a>
            <a th:href="@{/admin/surveys}" class="navbar-text" style="text-decoration: none;">Anket Yönetimi</a>
        </div>
        <form method="post" th:action="@{/logout}" class="mb-0">
            <button type="submit" class="btn btn-link btn-sm ing-navbar-link">Çıkış</button>
        </form>
    </div>
</nav>
<div class="container pb-5" style="max-width: 720px;">
    <h1 class="h3 mb-4">Yeni Anket</h1>

    <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

    <form method="post" th:action="@{/admin/surveys/new}">
        <div class="mb-3">
            <label class="form-label" for="title">Anket Başlığı</label>
            <input type="text" class="form-control" id="title" name="title" required/>
        </div>
        <div class="mb-4">
            <label class="form-label" for="description">Açıklama (opsiyonel)</label>
            <textarea class="form-control" id="description" name="description" rows="2"></textarea>
        </div>
        <button type="submit" class="btn btn-primary">Devam Et — Soru Ekle</button>
    </form>
</div>
</body>
</html>
