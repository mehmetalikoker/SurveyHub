<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Giriş - SurveyHub</title>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link th:href="@{/css/theme.css}" rel="stylesheet"/>
</head>
<body>
<nav class="navbar ing-navbar mb-5">
    <div class="container justify-content-center" style="max-width: 420px;">
        <span class="navbar-brand mb-0">SurveyHub</span>
    </div>
</nav>
<div class="container" style="max-width: 420px;">
    <h1 class="h4 mb-4 text-center">Yönetici Girişi</h1>

    <div class="alert alert-danger" th:if="${param.error}">Kullanıcı adı veya parola hatalı.</div>
    <div class="alert alert-success" th:if="${param.logout}">Çıkış yapıldı.</div>

    <form method="post" th:action="@{/login}">
        <div class="mb-3">
            <label class="form-label" for="username">Kullanıcı Adı</label>
            <input type="text" class="form-control" id="username" name="username" autofocus required/>
        </div>
        <div class="mb-4">
            <label class="form-label" for="password">Parola</label>
            <input type="password" class="form-control" id="password" name="password" required/>
        </div>
        <button type="submit" class="btn btn-primary w-100">Giriş Yap</button>
    </form>
</div>
</body>
</html>
